[program:selfcanvas-redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save 60 1 --dir /home/deploy/selfcanvas/.runtime
directory=/home/deploy/selfcanvas
user=deploy
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/deploy/selfcanvas/.runtime/redis.log
stderr_logfile=/home/deploy/selfcanvas/.runtime/redis-error.log

[program:selfcanvas-api]
command=/usr/bin/python3 /home/deploy/selfcanvas/server.py
directory=/home/deploy/selfcanvas
user=deploy
environment=HOME="/home/deploy",PATH="/home/deploy/.local/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/deploy/selfcanvas/.runtime/api.log
stderr_logfile=/home/deploy/selfcanvas/.runtime/api-error.log

[program:selfcanvas-worker]
command=/usr/bin/node --env-file=/home/deploy/selfcanvas/.env /home/deploy/selfcanvas/workers/media-render-worker/index.mjs
directory=/home/deploy/selfcanvas
user=deploy
environment=HOME="/home/deploy",PATH="/home/deploy/.local/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/deploy/selfcanvas/.runtime/worker.log
stderr_logfile=/home/deploy/selfcanvas/.runtime/worker-error.log

[program:selfcanvas-video-edit-worker]
command=/usr/bin/node --env-file=/home/deploy/selfcanvas/.env /home/deploy/selfcanvas/workers/video-edit-worker/index.mjs
directory=/home/deploy/selfcanvas
user=deploy
environment=HOME="/home/deploy",PATH="/home/deploy/.local/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/deploy/selfcanvas/.runtime/video-edit-worker.log
stderr_logfile=/home/deploy/selfcanvas/.runtime/video-edit-worker-error.log

[program:selfcanvas-mcp]
command=/usr/bin/node --env-file=/home/deploy/selfcanvas/.env /home/deploy/selfcanvas/mcp/http.mjs
directory=/home/deploy/selfcanvas
user=deploy
environment=HOME="/home/deploy",PATH="/home/deploy/.local/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/home/deploy/selfcanvas/.runtime/mcp.log
stderr_logfile=/home/deploy/selfcanvas/.runtime/mcp-error.log

[group:selfcanvas]
programs=selfcanvas-redis,selfcanvas-api,selfcanvas-worker,selfcanvas-video-edit-worker,selfcanvas-mcp
priority=999
