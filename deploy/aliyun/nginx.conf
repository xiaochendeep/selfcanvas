worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 512m;
  client_body_timeout 120s;
  keepalive_timeout 30s;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }
  map $host $allowed_private_host {
    default 0;
    10.66.66.1 1;
    100.78.18.60 1;
    127.0.0.1 1;
    localhost 1;
  }
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header CF-Connecting-IP "";
  proxy_set_header True-Client-IP "";
  proxy_set_header Forwarded "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  allow 127.0.0.1;
  allow 10.66.66.0/24;
  allow 100.64.0.0/10;
  allow 192.168.1.0/24;
  allow 192.168.100.0/24;
  deny all;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  server {
    listen 10.66.66.1:5190;
    listen 100.78.18.60:5190;
    server_name 10.66.66.1 100.78.18.60;
    if ($allowed_private_host = 0) { return 421; }
    location / { proxy_pass http://127.0.0.1:8787; }
  }
  server {
    listen 10.66.66.1:8080;
    listen 100.78.18.60:8080;
    server_name 10.66.66.1 100.78.18.60;
    if ($allowed_private_host = 0) { return 421; }
    location / { proxy_pass http://127.0.0.1:8080; }
  }
  server {
    listen 10.66.66.1:8790;
    server_name 10.66.66.1;
    if ($allowed_private_host = 0) { return 421; }
    location / { proxy_pass http://127.0.0.1:8790; }
  }
}
